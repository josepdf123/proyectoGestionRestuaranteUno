{% extends 'core/base.html' %}
{% block title %}Bienvenido - Restaurante{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow">
            <div class="card-body py-5">
                <i class="bi bi-person-circle" style="font-size: 4rem; color: #adb5bd;"></i>
                <h2 class="mt-3">¡Bienvenido, {{ usuario }}!</h2>
                <p class="text-muted">Rol: <span class="badge bg-secondary fs-6">{{ rol }}</span></p>
                <hr>
                <p class="text-muted">Tu rol aún no tiene un panel asignado.<br>Contacta al administrador.</p>
                <a href="{% url 'logout' %}" class="btn btn-outline-dark mt-2">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
