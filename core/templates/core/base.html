<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurante{% endblock %}</title>

    <!-- Bootstrap 5 CSS (via CDN, no requiere instalación) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card-add { border: 2px dashed #adb5bd; background: transparent; cursor: pointer; min-height: 180px; display: flex; align-items: center; justify-content: center; }
        .card-add:hover { border-color: #0d6efd; background-color: #f0f4ff; }
        .badge-disponible { background-color: #198754; }
        .badge-reservada { background-color: #fd7e14; }
        .badge-ocupada { background-color: #dc3545; }
        .mesa-number { font-size: 2rem; font-weight: 700; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'mesas_lista' %}">
            🍽️ Restaurante
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% block nav_mesas %}{% endblock %}" href="{% url 'mesas_lista' %}">
                        <i class="bi bi-grid-3x3-gap"></i> Mesas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_platos %}{% endblock %}" href="{% url 'platos_lista' %}">
                        <i class="bi bi-egg-fried"></i> Platos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_menus %}{% endblock %}" href="{% url 'menus_lista' %}">
                        <i class="bi bi-journal-text"></i> Menús
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_usuarios %}{% endblock %}" href="{% url 'usuarios_lista' %}">
                        <i class="bi bi-people"></i> Usuarios
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Mensajes de alerta -->
<div class="container mt-3">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
</div>

<!-- Contenido principal -->
<div class="container mt-4 mb-5">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap 5 JS (via CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
